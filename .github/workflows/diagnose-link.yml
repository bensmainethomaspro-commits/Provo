name: Diagnostic — résolution d'un lien

# Outil de diagnostic temporaire. L'environnement de développement ne peut
# joindre ni share.google ni Supabase ; un runner GitHub le peut, depuis une IP
# de datacenter — exactement la situation de la fonction Edge.

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Lien à analyser'
        required: true
        default: 'https://share.google/WNSiI0AooI1HiDmyD'
  push:
    paths:
      - '.github/workflows/diagnose-link.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: A · La fonction Edge répond-elle ?
        env:
          URL: ${{ github.event.inputs.url || 'https://share.google/WNSiI0AooI1HiDmyD' }}
          KEY: sb_publishable_yaO8Y2s2j2WspT4gYsRmlw_SO7m92nD
        run: |
          echo "Appel de extract-place avec la clé publiable, comme le fait le client."
          curl -sS -X POST \
            "https://usztistixgzdrvjzplqx.supabase.co/functions/v1/extract-place" \
            -H "Authorization: Bearer $KEY" \
            -H "apikey: $KEY" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            -w '\n--- CODE HTTP: %{http_code} ---\n' \
            -d "{\"url\":\"$URL\"}" | head -c 1500
          echo

      - name: B · Le proxy CORS du client résout-il la redirection ?
        env:
          URL: ${{ github.event.inputs.url || 'https://share.google/WNSiI0AooI1HiDmyD' }}
        run: |
          echo "allorigins.win doit renvoyer l'URL finale dans status.url."
          curl -sS --max-time 40 \
            "https://api.allorigins.win/get?url=$(python3 -c "import urllib.parse,os;print(urllib.parse.quote(os.environ['URL'],safe=''))")" \
            -w '\n--- CODE HTTP: %{http_code} ---\n' \
            -o /tmp/proxy.json || echo "ÉCHEC"
          echo "taille de la réponse : $(wc -c < /tmp/proxy.json 2>/dev/null || echo 0) octets"
          python3 - <<'PY' || echo "réponse illisible"
          import json
          d = json.load(open('/tmp/proxy.json'))
          st = d.get('status', {})
          print('status.url  :', st.get('url'))
          print('status.code :', st.get('http_code'))
          print('contenu     :', len(d.get('contents') or ''), 'caractères')
          PY
