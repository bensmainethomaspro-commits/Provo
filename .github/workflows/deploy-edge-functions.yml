name: Déployer les fonctions Supabase

# La fonction « extract-place » tourne chez Supabase, pas sur Vercel : elle ne
# part donc pas avec le déploiement du site. Sans ce workflow, chaque correctif
# de l'extracteur de liens restait sans effet jusqu'à un déploiement manuel.
#
# Mise en route — une seule fois :
#   1. Créer un jeton sur https://supabase.com/dashboard/account/tokens
#   2. Le coller dans Settings › Secrets and variables › Actions du dépôt,
#      sous le nom SUPABASE_ACCESS_TOKEN.
# Le jeton ne transite jamais ailleurs que dans le coffre du dépôt.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'
  workflow_dispatch:

# Pour ouvrir une alerte quand le déploiement échoue (dernière étape).
permissions:
  contents: read
  issues: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que le jeton est configuré
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            echo "::error::Le secret SUPABASE_ACCESS_TOKEN est absent."
            echo "Ajoute-le dans Settings › Secrets and variables › Actions."
            echo "Jeton à créer sur https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Déployer toutes les fonctions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Référence du projet : déjà publique (elle est dans l'URL de l'API
          # utilisée par le client), ce n'est pas un secret.
          #
          # Le nom des fonctions était écrit en dur : ajouter « enrich-place »
          # ne déployait donc rien, et l'app appelait une fonction inexistante
          # sans que rien ne le signale. On parcourt le dossier.
          #
          # ATTENTION, CETTE BOUCLE NE SUPPRIME RIEN. Retirer un dossier du
          # dépôt ne retire pas la fonction de chez Supabase : elle y reste
          # déployée, appelable, et hors de vue. C'est arrivé avec
          # « read-receipt », partie le 31 août 2026 quand la lecture du ticket
          # est passée dans le navigateur. Une fonction supprimée ici se
          # supprime AUSSI à la main, dans le tableau de bord Supabase
          # (Edge Functions › la fonction › Delete).
          echo "Fonctions trouvées :"
          ls -1 supabase/functions
          for d in supabase/functions/*/; do
            nom=$(basename "$d")
            [ -f "$d/index.ts" ] || { echo "· $nom ignorée (pas d'index.ts)"; continue; }
            echo "::group::Déploiement de $nom"
            supabase functions deploy "$nom" --project-ref usztistixgzdrvjzplqx
            echo "::endgroup::"
          done

      # Du 31 août au 28 septembre 2026, ce workflow a échoué à CHAQUE fusion
      # (jeton refusé, 401) sans que personne le voie : le rouge d'un workflow
      # de déploiement ne se lit pas. La production est restée quatre semaines
      # sur des fonctions périmées. Un échec ouvre donc une alerte — une seule
      # à la fois — et un succès la referme.
      - name: Alerte si le déploiement échoue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploiement --color B60205 \
            --description "Déploiement des fonctions Edge en échec" 2>/dev/null || true
          NUM=$(gh issue list --state open --label deploiement --limit 1 --json number --jq '.[0].number // empty')
          CORPS=$(printf '🔴 **Les fonctions Edge ne sont pas déployées.** Ce qui a été fusionné sur `main` dans `supabase/functions/` n'\''est PAS en production.\n\nSi le journal dit `401 Unauthorized` : le jeton a expiré. En créer un sur https://supabase.com/dashboard/account/tokens, le reposer dans Settings › Secrets › Actions › `SUPABASE_ACCESS_TOKEN`, puis relancer ce workflow.\n\n%s\n' "$RUN")
          if [ -n "$NUM" ]; then
            printf '%s' "$CORPS" | gh issue comment "$NUM" --body-file -
          else
            printf '%s' "$CORPS" | gh issue create --title "Déploiement des fonctions Edge en échec" --label deploiement --body-file -
          fi

      - name: Refermer l'alerte au retour au vert
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --state open --label deploiement --limit 1 --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "🟢 Déploiement réussi : les fonctions en production sont à jour."
            gh issue close "$NUM"
          fi
