# Vérifier chaque PR avant qu'elle n'arrive sur main.
#
# Rien ne tournait sur une PR (audit A-043) : les suites existaient, mais ne se
# lançaient qu'à la main, le jour où le correctif était écrit, et plus jamais.
# Deux régressions du journal d'audit (A-046, A-047) sont arrivées par des PR
# fusionnées sans que personne ne relise.
#
# Deux travaux en parallèle :
#  · suites : build, puis les suites sans réseau ni navigateur (npm run verif),
#    dont la dette ESLint qui ne doit plus monter ; puis les fonctions Edge
#    sous Deno (typage, et `extract-place` entière face à un réseau simulé).
#    Une à deux minutes ;
#  · parcours : l'app construite, servie par `vite preview`, et les 87 parcours
#    qui appuient vraiment sur les boutons (services distants rejoués), plus la
#    synchro au démarrage et la carte. Une dizaine de minutes.
#
# `verif-ui` n'est pas ici : il rougit par construction sur les 52 points
# assumés de la carte (marqueurs Leaflet de 32 px). Il reste à lancer à la main
# avant une livraison d'interface. C'est le SEUL cas assumé : avant de croire
# qu'une suite garde quelque chose, vérifier qu'un travail ci-dessous la nomme.
# `verif-carte` n'y était pas, et il échouait — y compris sur `main` (A-081).
name: Vérifier la PR

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: verif-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  suites:
    name: Build et suites hors réseau
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dépendances
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build
        run: npm run build
      - name: Suites (npm run verif)
        run: npm run verif
      # La fonction Edge ENTIÈRE, sous son moteur, réseau simulé. Les suites
      # ci-dessus tournent sous Node et ne lisent que ses lecteurs partagés ;
      # le banc (`diagnose-places`) la lance pour de bon, mais Google n'y sert
      # pas son captcha sur commande. Le 14 novembre 2026, il l'a servi par
      # hasard : la fiche a pris pour titre le jeton de la page de vérification.
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Fonction extract-place sous Deno, Google refusant tout
        env:
          # Sans elle, Deno lit le `package.json` de l'app et résout ses
          # dépendances (voir `diagnose-places.yml`).
          DENO_NO_PACKAGE_JSON: "1"
        run: |
          deno check --node-modules-dir=auto supabase/functions/extract-place/index.ts supabase/functions/enrich-place/index.ts
          deno run --no-prompt --allow-env scripts/verif-fonction-captcha.ts

  parcours:
    name: Parcours dans un vrai navigateur
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Chromium
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Aperçu de l'app
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:4173/ > /dev/null && exit 0
            sleep 1
          done
          echo "L'aperçu n'a pas démarré :"; cat preview.log; exit 1
      - name: Parcours (npm run parcours)
        run: npm run parcours
      - name: Synchro au démarrage (npm run verif-demarrage)
        run: npm run verif-demarrage
      # Deux fois, et ce n'est pas du zèle : piocher depuis la carte ouvre une
      # feuille quand il reste de la journée devant soi, et rien en fin de
      # journée. Un seul passage ne couvre donc qu'un quart du temps — c'est ce
      # qui a laissé cette suite rouge sans que personne ne le voie (A-081).
      - name: Carte (npm run verif-carte)
        run: |
          npm run verif-carte
          PROVO_HEURE=02:07 npm run verif-carte
