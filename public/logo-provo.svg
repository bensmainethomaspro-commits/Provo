<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- White background circle -->
  <circle cx="50" cy="50" r="48" fill="white" stroke="#35A7DD" stroke-width="2"/>
  <!-- Compass ring -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#35A7DD" stroke-width="3.5" stroke-dasharray="6 4"/>
  <!-- Cardinal marks -->
  <circle cx="50" cy="12" r="3" fill="#35A7DD"/>
  <circle cx="88" cy="50" r="3" fill="#35A7DD"/>
  <circle cx="50" cy="88" r="3" fill="#35A7DD"/>
  <circle cx="12" cy="50" r="3" fill="#35A7DD"/>
  <!-- Letter P styled as compass needle -->
  <!-- Vertical stroke of P -->
  <rect x="30" y="20" width="8" height="60" rx="4" fill="#35A7DD"/>
  <!-- Curved top of P (the bump) -->
  <path d="M38 20 Q65 20 65 37 Q65 54 38 54" fill="none" stroke="#35A7DD" stroke-width="8" stroke-linecap="round"/>
  <!-- North needle tip pointing up from P -->
  <polygon points="50,5 46,18 54,18" fill="#35A7DD"/>
  <!-- South tail (lighter) -->
  <polygon points="50,95 46,82 54,82" fill="#FFB896"/>
  <!-- Center dot -->
  <circle cx="50" cy="50" r="4" fill="#35A7DD"/>
</svg>
